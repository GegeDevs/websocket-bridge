name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: ubuntu-22.04, target: aarch64-unknown-linux-gnu, ext: "" }
          - { os: ubuntu-22.04, target: armv7-unknown-linux-gnueabihf, ext: "" }
          - { os: ubuntu-22.04, target: i686-unknown-linux-gnu, ext: "" }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-musl, ext: "" }
          - { os: ubuntu-22.04, target: aarch64-unknown-linux-musl, ext: "" }
          - { os: ubuntu-22.04, target: armv7-unknown-linux-musleabihf, ext: "" }
          - { os: ubuntu-22.04, target: i686-unknown-linux-musl, ext: "" }
          - { os: ubuntu-22.04, target: x86_64-apple-darwin, ext: "", zig: true }
          - { os: ubuntu-22.04, target: aarch64-apple-darwin, ext: "", zig: true }
          - { os: windows-2022, target: x86_64-pc-windows-msvc, ext: ".exe" }
          - { os: windows-2022, target: aarch64-pc-windows-msvc, ext: ".exe" }
          - { os: windows-2022, target: i686-pc-windows-msvc, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.zig && 'zig-' || '' }}${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        if: startsWith(matrix.os, 'ubuntu-') && !matrix.zig
        with:
          tool: cross
      - uses: taiki-e/install-action@v2
        if: matrix.zig
        with:
          tool: cargo-zigbuild
      - name: Install Zig
        if: matrix.zig
        env:
          ZIG_URL: https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
        run: |
          mkdir -p "$HOME/zig"
          curl -fL "$ZIG_URL" | tar -xJ -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - name: Install macOS cross SDK
        if: matrix.zig
        env:
          MACOS_SDK_URL: https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.3.sdk.tar.xz
        run: |
          mkdir -p "$HOME/xcc"
          curl -fL "$MACOS_SDK_URL" | tar -xJ -C "$HOME/xcc"
          echo "SDKROOT=$HOME/xcc/MacOSX11.3.sdk" >> "$GITHUB_ENV"
          echo "$HOME/xcc/MacOSX11.3.sdk/usr/lib" >> "$GITHUB_PATH"
      - name: Build macOS with cross
        if: matrix.zig
        run: cargo-zigbuild build --release --target ${{ matrix.target }} --locked
      - name: Build with cross
        if: startsWith(matrix.os, 'ubuntu-') && !matrix.zig
        run: cross build --release --target ${{ matrix.target }} --locked
      - name: Build native
        if: ${{ !startsWith(matrix.os, 'ubuntu-') }}
        run: cargo build --release --target ${{ matrix.target }} --locked
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME:-${GITHUB_SHA}}"
          version="${version#v}"
          binary="target/${{ matrix.target }}/release/websocket-bridge${{ matrix.ext }}"
          mkdir -p dist
          archive_name="websocket-bridge-${version}-${{ matrix.target }}.tar.gz"
          if [[ "${{ matrix.ext }}" == ".exe" ]]; then
            archive_name="websocket-bridge-${version}-${{ matrix.target }}.zip"
            cp "$binary" "websocket-bridge${{ matrix.ext }}"
            powershell -NoProfile -Command "Compress-Archive -Force -Path 'websocket-bridge.exe' -DestinationPath 'dist/$archive_name'"
            rm -f websocket-bridge.exe
          else
            cp "$binary" websocket-bridge
            tar -czf "dist/$archive_name" websocket-bridge
            rm -f websocket-bridge
          fi
          ls -lh "dist/$archive_name"
      - uses: actions/upload-artifact@v4
        with:
          name: websocket-bridge-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
